<!DOCTYPE html>
<html>
<head>
    <title>Login Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        input, button { margin: 5px; padding: 8px; }
        button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>POS Login Debug Test</h1>
    <p>This will test the exact same API calls that the React app should make.</p>
    
    <form id="loginForm">
        <div>
            <label>Username:</label>
            <input type="text" id="username" value="admin" required>
        </div>
        <div>
            <label>Password:</label>
            <input type="password" id="password" value="admin123" required>
        </div>
        <button type="submit">Test Login</button>
    </form>
    
    <div id="results"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="result">Testing login...</div>';
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                // Step 1: Test the login API
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                
                console.log('Sending login request to /api/auth/token');
                
                const loginResponse = await fetch('/api/auth/token', {
                    method: 'POST',
                    body: formData,
                });
                
                console.log('Login response status:', loginResponse.status);
                
                if (!loginResponse.ok) {
                    throw new Error(`Login failed with status ${loginResponse.status}`);
                }
                
                const loginData = await loginResponse.json();
                console.log('Login response data:', loginData);
                
                if (loginData.access_token) {
                    resultsDiv.innerHTML += '<div class="result success">✅ Step 1: Login API successful - Token received</div>';
                    
                    // Step 2: Test getting user info
                    console.log('Getting user info with token:', loginData.access_token);
                    
                    const userResponse = await fetch('/api/auth/me', {
                        headers: { 
                            'Authorization': `Bearer ${loginData.access_token}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    console.log('User info response status:', userResponse.status);
                    
                    if (!userResponse.ok) {
                        throw new Error(`User info failed with status ${userResponse.status}`);
                    }
                    
                    const userData = await userResponse.json();
                    console.log('User data:', userData);
                    
                    resultsDiv.innerHTML += '<div class="result success">✅ Step 2: User info API successful</div>';
                    resultsDiv.innerHTML += '<div class="result success">🎉 COMPLETE LOGIN FLOW SUCCESSFUL!</div>';
                    resultsDiv.innerHTML += `<div class="result">User: ${userData.full_name} (${userData.role})</div>`;
                    resultsDiv.innerHTML += `<div class="result">Token: ${loginData.access_token.substring(0, 50)}...</div>`;
                    
                } else {
                    throw new Error('No access token in response');
                }
                
            } catch (error) {
                console.error('Login test error:', error);
                resultsDiv.innerHTML += `<div class="result error">❌ Error: ${error.message}</div>`;
            }
        });
        
        // Test the endpoints on page load
        window.addEventListener('load', () => {
            fetch('/api/auth/token', { method: 'OPTIONS' })
                .then(response => {
                    console.log('OPTIONS /api/auth/token status:', response.status);
                    if (response.ok) {
                        document.getElementById('results').innerHTML = '<div class="result success">✅ Backend API is reachable</div>';
                    }
                })
                .catch(error => {
                    document.getElementById('results').innerHTML = '<div class="result error">❌ Backend API not reachable: ' + error.message + '</div>';
                });
        });
    </script>
</body>
</html>
